<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Noe Ceballos &mdash; NevkaR</title>
    <meta name="description" content="Noe Ceballos, NevkaR. Used cars, mechanic shop, 24/7 towing, junk cars, body &amp; paint - Kansas City Metro.">

    <!-- PWA / Home Screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Card">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1A1A1A">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* Brand colors live on the button + the QR only. The card stays clean. */
            --heat: #F36A1B;
            --heat-rgb: 243, 106, 27;
            --cool: #2F9FD8;
            --cool-rgb: 47, 159, 216;
            --split: linear-gradient(100deg, var(--heat) 0%, var(--cool) 100%);

            --bg: #1A1A1A;
            --text-primary: #FFFFFF;
            --text-secondary: #C7CCD4;
            --text-muted: #808285;
            --hairline: rgba(255, 255, 255, 0.10);
        }

        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
            background: linear-gradient(180deg, #232323 0%, var(--bg) 100%);
            border: 1px solid var(--hairline);
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* One restrained brand cue on the top edge */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 58%;
            height: 2px;
            background: var(--split);
            border-radius: 2px;
        }

        .logo {
            width: 150px;
            height: 150px;
            margin: 0 auto 22px;
            border-radius: 50%;
            overflow: hidden;
        }

        .logo img { width: 100%; height: 100%; object-fit: contain; }

        .name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 21px;
            color: var(--text-primary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .company {
            font-weight: 500;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        /* Hairline rule with a small checkered-flag ornament at center */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0 auto 18px;
            width: 190px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--hairline);
        }
        .flag {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 5px rgba(var(--heat-rgb), 0.45));
        }

        .tagline {
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 14px;
        }

        .bio {
            font-size: 13.5px;
            line-height: 1.65;
            color: var(--text-secondary);
            font-weight: 300;
            margin-bottom: 26px;
            padding: 0 6px;
        }

        .bio .area { color: var(--text-muted); font-size: 12.5px; }

        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        /* Neutral rows - clean, no per-row color */
        .contact-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--hairline);
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: all 0.2s ease;
        }

        .contact-link:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.22);
        }

        .contact-link svg { width: 18px; height: 18px; flex-shrink: 0; fill: var(--text-secondary); }
        .contact-link span { color: var(--text-secondary); }

        /* SINGLE action: show the QR. No direct .vcf link - standing card standard. */
        .save-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            background: var(--split);
            color: #FFFFFF;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            margin-bottom: 22px;
        }

        .save-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(var(--heat-rgb), 0.20), 0 6px 24px rgba(var(--cool-rgb), 0.20);
        }

        .save-btn:active { transform: translateY(0); }
        .save-btn svg { width: 19px; height: 19px; fill: #FFFFFF; }

        .qr-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .qr-overlay.active { display: flex; }

        .qr-modal {
            background: #202020;
            border: 1px solid var(--hairline);
            border-radius: 18px;
            padding: 28px;
            text-align: center;
            max-width: 340px;
            width: 100%;
        }

        .qr-modal h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .qr-modal p { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }

        .qr-frame {
            background: #FFFFFF;
            border-radius: 14px;
            padding: 10px;
            margin: 0 auto 18px;
            width: 250px;
        }
        .qr-frame img { width: 100%; height: auto; display: block; }

        .qr-close {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--text-secondary);
            padding: 10px 26px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .qr-close:hover { border-color: rgba(255, 255, 255, 0.4); color: var(--text-primary); }

        .footer { font-size: 11px; color: var(--text-muted); }
        .footer a { color: var(--text-secondary); text-decoration: none; }

        @media (max-width: 480px) {
            .card { padding: 32px 24px; }
            .name { font-size: 18px; letter-spacing: 1px; }
            .tagline { font-size: 11px; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="logo.png" alt="NevkaR">
        </div>

        <div class="name">Noe Ceballos</div>
        <div class="company">NevkaR</div>

        <div class="divider">
            <svg class="flag" viewBox="0 0 24 24" aria-hidden="true">
                <defs>
                    <pattern id="checker" width="7.5" height="6.5" patternUnits="userSpaceOnUse">
                        <rect width="3.75" height="3.25" fill="#F5F5F5"/>
                        <rect x="3.75" width="3.75" height="3.25" fill="#161616"/>
                        <rect y="3.25" width="3.75" height="3.25" fill="#161616"/>
                        <rect x="3.75" y="3.25" width="3.75" height="3.25" fill="#F5F5F5"/>
                    </pattern>
                </defs>
                <rect x="3" y="2" width="1.6" height="20" rx="0.8" fill="#B9C0C9"/>
                <rect x="4.6" y="3" width="15" height="10" fill="url(#checker)" stroke="#000" stroke-opacity="0.35" stroke-width="0.4"/>
            </svg>
        </div>

        <div class="tagline">Buy it &middot; Fix it &middot; Tow it &middot; Sell it</div>

        <div class="bio">
            Used Cars &bull; Mechanic Shop &bull; 24/7 Towing &bull; Body &amp; Paint<br>
            <span class="area">Kansas City Metro &middot; Se habla espa&ntilde;ol</span>
        </div>

        <div class="contact-links">
            <a href="tel:+18164694380" class="contact-link">
                <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                <span>(816) 469-4380</span>
            </a>
            <a href="https://nevkar-auto.vercel.app" target="_blank" rel="noopener" class="contact-link">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm7.93 9h-3.02c-.11-1.86-.48-3.58-1.05-5.03A8.014 8.014 0 0 1 19.93 11zM12 4.04c.83 1.2 1.48 3.19 1.77 5.96h-3.54c.29-2.77.94-4.76 1.77-5.96zM4.26 14c-.16-.64-.26-1.31-.26-2s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.81 2h3.02c.11 1.86.48 3.58 1.05 5.03A7.987 7.987 0 0 1 5.07 16zm3.02-8H5.07a7.987 7.987 0 0 1 4.07-5.03C8.57 4.42 8.2 6.14 8.09 8zM12 19.96c-.83-1.2-1.48-3.19-1.77-5.96h3.54c-.29 2.77-.94 4.76-1.77 5.96zM10.23 12c-.09-.66-.15-1.32-.15-2s.06-1.34.15-2h3.54c.09.66.15 1.32.15 2s-.06 1.34-.15 2h-3.54zm4.32 6.97c.57-1.45.94-3.17 1.05-5.03h3.02a8.014 8.014 0 0 1-4.07 5.03zM15.6 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2H15.6z"/></svg>
                <span>nevkar-auto.vercel.app</span>
            </a>
        </div>

        <button class="save-btn" onclick="toggleQR()">
            <svg viewBox="0 0 24 24"><path d="M3 11h8V3H3v8zm2-6h4v4H5V5zm8-2v8h8V3h-8zm6 6h-4V5h4v4zM3 21h8v-8H3v8zm2-6h4v4H5v-4zm13-2h-2v3h-3v2h3v3h2v-3h3v-2h-3v-3zm-3 8v-2h-2v2h2zm4 0v-2h-2v2h2z"/></svg>
            Save My Contact
        </button>

        <div class="footer">Powered by <a href="https://www.sharkitectdigital.com" target="_blank" rel="noopener">Sharkitect</a></div>
    </div>

    <div class="qr-overlay" id="qrOverlay" onclick="toggleQR()">
        <div class="qr-modal" onclick="event.stopPropagation()">
            <h3>SCAN TO SAVE</h3>
            <p>Point your camera at the code</p>
            <div class="qr-frame">
                <img src="qr-code.png" alt="Scan to save Noe Ceballos's contact">
            </div>
            <button class="qr-close" onclick="toggleQR()">Close</button>
        </div>
    </div>

    <script>
        function toggleQR() {
            document.getElementById('qrOverlay').classList.toggle('active');
        }
    </script>
</body>
</html>
